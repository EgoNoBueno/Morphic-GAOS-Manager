# Build → Plan → (human gate via GitHub Environment) → Apply
#
# Single-run integrity: all three jobs share the same workflow run ID,
# so the tfplan artifact downloaded by Apply is exactly what Plan generated.
# The "production" environment provides the human approval gate.
#
# Prerequisites (one-time setup, see GAOS-Deploy-Spec.md §9.3):
#   1. Configure WIF: pool + OIDC provider + IAM binding (see §9.3 step 3)
#   2. Create GitHub Secret: WIF_PROVIDER (provider resource name from step 3)
#   3. Create GitHub Environment: "production" with a required reviewer
#   4. Bootstrap GCS state bucket and Artifact Registry repo (see §9.3)

name: Deploy GAOS Agents

on:
  push:
    branches: [master]

permissions:
  id-token: write   # Required: allows the workflow to request an OIDC token for WIF
  contents: read

env:
  PROJECT_ID: morphic-gaos-prod
  REGION: us-central1
  REGISTRY: us-central1-docker.pkg.dev
  IMAGE: us-central1-docker.pkg.dev/morphic-gaos-prod/cloud-run-source-deploy/gaos-agent

jobs:
  # ── Job 1: Build & push the container image ────────────────────────────────
  build:
    name: Build & Push Image
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: deployer-sa@morphic-gaos-prod.iam.gserviceaccount.com

      # Required step: gcloud auth configure-docker makes docker aware of the
      # *.pkg.dev credential helper. Without this, docker push returns 403
      # even with valid GCP credentials.
      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ env.REGISTRY }} --quiet

      - name: Build and push image
        run: |
          docker build -t ${{ env.IMAGE }}:${{ github.sha }} .
          docker push ${{ env.IMAGE }}:${{ github.sha }}

  # ── Job 2: Generate and upload the OpenTofu plan ──────────────────────────
  plan:
    name: OpenTofu Plan
    runs-on: ubuntu-latest
    needs: build

    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: deployer-sa@morphic-gaos-prod.iam.gserviceaccount.com

      - name: Set up OpenTofu
        uses: opentofu/setup-opentofu@v1

      - name: OpenTofu Init
        working-directory: infra
        run: tofu init

      - name: OpenTofu Plan
        working-directory: infra
        run: tofu plan -var="image_tag=${{ github.sha }}" -out=tfplan

      - name: Upload plan artifact
        uses: actions/upload-artifact@v4
        with:
          name: tfplan
          path: infra/tfplan
          # 3-day retention: long enough for a Friday push to be approved Monday
          # morning; short enough to prevent dangerously stale plans from applying.
          retention-days: 3

  # ── Job 3: Apply — requires human approval via GitHub Environment ──────────
  apply:
    name: OpenTofu Apply
    runs-on: ubuntu-latest
    needs: plan
    environment: production   # GitHub Environment with required reviewer — this is the human gate

    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: deployer-sa@morphic-gaos-prod.iam.gserviceaccount.com

      - name: Set up OpenTofu
        uses: opentofu/setup-opentofu@v1

      - name: OpenTofu Init
        working-directory: infra
        run: tofu init

      # Downloads the binary plan from the same run as the plan job.
      # This guarantees Apply executes exactly what was reviewed — no TOCTOU risk.
      - name: Download plan artifact
        uses: actions/download-artifact@v4
        with:
          name: tfplan
          path: infra

      - name: OpenTofu Apply
        working-directory: infra
        run: tofu apply tfplan
