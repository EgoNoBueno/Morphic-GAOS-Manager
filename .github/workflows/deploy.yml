# Build → Plan → (human gate via GitHub Environment) → Apply
#
# Single-run integrity: all three jobs share the same workflow run ID,
# so the tfplan artifact downloaded by Apply is exactly what Plan generated.
# The "production" environment provides the human approval gate.
#
# Prerequisites (one-time setup, see GAOS-Deploy-Spec.md §9.3):
#   1. Configure WIF: pool + OIDC provider + IAM binding (see §9.3 step 3)
#   2. Create GitHub Secret: WIF_PROVIDER (provider resource name from step 3)
#   3. Create GitHub Environment: "production" with a required reviewer
#   4. Bootstrap GCS state bucket and Artifact Registry repo (see §9.3)

name: Deploy GAOS Agents

on:
  push:
    branches: [master]

# Prevent overlapping deployments to the same branch. Concurrency is enforced
# per-job so that a newer push can cancel a stale build or plan, but can never
# interrupt an in-flight apply and leave infrastructure half-applied.
# The apply job additionally relies on the "production" GitHub Environment, which
# provides a required-reviewer gate and its own serialization across all runs.

permissions:
  id-token: write   # Required: allows the workflow to request an OIDC token for WIF
  contents: read

env:
  PROJECT_ID: morphic-gaos-prod
  REGION: us-central1
  REGISTRY: us-central1-docker.pkg.dev
  IMAGE: us-central1-docker.pkg.dev/morphic-gaos-prod/cloud-run-source-deploy/gaos-agent

jobs:
  # ── Job 1: Build & push the container image ────────────────────────────────
  build:
    name: Build & Push Image
    runs-on: ubuntu-latest
    # A newer push cancels any queued or in-progress build — stale images should not
    # block the queue. Safe to cancel because no infra state is touched here.
    concurrency:
      group: build-${{ github.ref }}
      cancel-in-progress: true

    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.WIF_SERVICE_ACCOUNT }}

      # Required step: gcloud auth configure-docker makes docker aware of the
      # *.pkg.dev credential helper. Without this, docker push returns 403
      # even with valid GCP credentials.
      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ env.REGISTRY }} --quiet

      # settings.yaml is gitignored (contains project IDs) but must be present
      # in the Docker build context so the container can load config at runtime.
      # The file is stored base64-encoded in the SETTINGS_YAML GitHub Secret.
      # Update the secret via: gh secret set SETTINGS_YAML --body $(base64 config/settings.yaml)
      - name: Write settings.yaml from secret
        run: echo "${{ secrets.SETTINGS_YAML }}" | base64 --decode > config/settings.yaml

      - name: Build and push image
        run: |
          docker build -t ${{ env.IMAGE }}:${{ github.sha }} .
          docker push ${{ env.IMAGE }}:${{ github.sha }}

  # ── Job 2: Generate and upload the OpenTofu plan ──────────────────────────
  plan:
    name: OpenTofu Plan
    runs-on: ubuntu-latest
    needs: build
    # A newer push cancels any queued or in-progress plan — stale plans must not
    # reach the apply gate. Safe to cancel because tofu plan makes no changes.
    concurrency:
      group: plan-${{ github.ref }}
      cancel-in-progress: true

    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.WIF_SERVICE_ACCOUNT }}

      - name: Set up OpenTofu
        uses: opentofu/setup-opentofu@9d84900f3238fab8cd84ce47d658d25dd008be2f  # v1.0.8

      - name: OpenTofu Init
        working-directory: infra
        run: tofu init

      - name: OpenTofu Plan
        working-directory: infra
        run: tofu plan -var="image_tag=${{ github.sha }}" -out=tfplan

      - name: Upload plan artifact
        uses: actions/upload-artifact@v4
        with:
          name: tfplan
          path: infra/tfplan
          # 3-day retention: long enough for a Friday push to be approved Monday
          # morning; short enough to prevent dangerously stale plans from applying.
          retention-days: 3

  # ── Job 3: Apply — requires human approval via GitHub Environment ──────────
  apply:
    name: OpenTofu Apply
    runs-on: ubuntu-latest
    needs: plan
    environment: production   # GitHub Environment with required reviewer — this is the human gate
    # cancel-in-progress: false (the default) — an in-flight apply must never be
    # interrupted mid-run or infrastructure will be left in a partial state.
    # Serialization across concurrent runs is handled by the 'production' GitHub
    # Environment, which queues additional runs until the active one completes.
    concurrency:
      group: apply-${{ github.ref }}
      cancel-in-progress: false

    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.WIF_SERVICE_ACCOUNT }}

      - name: Set up OpenTofu
        uses: opentofu/setup-opentofu@9d84900f3238fab8cd84ce47d658d25dd008be2f  # v1.0.8

      - name: OpenTofu Init
        working-directory: infra
        run: tofu init

      # Downloads the binary plan from the same run as the plan job.
      # This guarantees Apply executes exactly what was reviewed — no TOCTOU risk.
      - name: Download plan artifact
        uses: actions/download-artifact@v4
        with:
          name: tfplan
          path: infra

      - name: OpenTofu Apply
        working-directory: infra
        run: tofu apply tfplan

      # Wire CLOUD_RUN_URL on nexus-prime so Chat JWT audience verification works.
      # The URL is only known after Apply, so this post-apply step reads it from
      # TF outputs and updates the Cloud Run service in-place — no revision is
      # promoted, only the env var is updated, so it takes effect immediately.
      - name: Wire CLOUD_RUN_URL on nexus-prime
        working-directory: infra
        run: |
          NEXUS_URL=$(tofu output -raw nexus_prime_url)
          gcloud run services update nexus-prime \
            --update-env-vars "CLOUD_RUN_URL=${NEXUS_URL}" \
            --region=${{ env.REGION }} \
            --project=${{ env.PROJECT_ID }} \
            --quiet
