[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "morphic-gaos-manager"
version = "0.1.0"
description = "Morphic-G AOS — self-evolving multi-agent system for small business operations"
requires-python = ">=3.11"
dependencies = [
    "google-cloud-secret-manager>=2.20.0",
    "google-cloud-pubsub>=2.21.0",
    "gspread>=6.0.0",
    "pydantic>=2.7.0",
    "google-adk>=0.3.0",
    "langgraph>=0.2.0",
    "google-cloud-bigquery>=3.25.0",
    "google-cloud-logging>=3.10.0",
    "google-cloud-aiplatform>=1.57.0",
    "google-genai>=1.0.0",
    "pyyaml>=6.0",
    "httpx>=0.27.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.4.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.hatch.build.targets.wheel]
packages = ["tools", "config", "models"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"
