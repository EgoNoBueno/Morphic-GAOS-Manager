# Docs/DOC-INDEX.yaml
#
# Machine-readable index of all documents in Docs/.
# Used by AI sessions (Rule 13) to determine which documents need updating
# after a given code or config change.
#
# Schema:
#   documents:
#     <filename>:
#       purpose:       one-line description of what this document covers
#       code_paths:    list of repo paths whose changes trigger this doc
#       triggers:      plain-English descriptions of change events that require an update
#
# Agent identity files follow the same schema under `agent_identity_files:`.
# Each agent in Docs/agents/<name>.md maps to agents/<name>/orchestrator.py.
#
# Inverse index (code path → documents to update) is at the bottom of this file
# for quick lookup during an AI session.

# ---------------------------------------------------------------------------
# PRIMARY SPEC DOCUMENTS
# ---------------------------------------------------------------------------

documents:

  GAOS-Agent-Spec.md:
    purpose: >
      Canonical spec for all 7 orchestrator agents — boot sequence, event loop,
      AgentState FSM, heartbeat, identity loading, and shared agent conventions.
    code_paths:
      - agents/
      - main.py
    triggers:
      - New agent added to agents/
      - Boot sequence order changed (Rule 9)
      - AgentState enum modified (new states, renamed states)
      - log_state_transition() semantics changed
      - Event loop or Pub/Sub subscription pattern changed
      - Heartbeat interval or payload schema changed
      - New shared agent behavior established

  GAOS-Tools-Spec.md:
    purpose: >
      Full API reference for every file in tools/ — function signatures,
      parameters, return types, error types, usage rules, and the reference index.
    code_paths:
      - tools/
    triggers:
      - New file created in tools/
      - Public function signature changed in tools/ (name, params, return type)
      - New export added or removed from tools/__init__.py
      - New tool usage rule established (§13)
      - New section added to the spec (§14 index must be updated)
      - Circuit breaker wiring points change
      - Phoenix recovery integration changed

  GAOS-Deploy-Spec.md:
    purpose: >
      Deployment runbook — GCP project setup, BigQuery tables and schemas,
      Cloud Run config, Pub/Sub topics, Scheduler jobs, phase exit checklists,
      OpenTofu pipeline, and verification commands.
    code_paths:
      - infra/
      - Dockerfile
      - main.py
      - scripts/bootstrap.py
      - scripts/provision_schedulers.py
      - scripts/provision_missing_folders.py
      - scripts/setup_workspace.py
      - scripts/setup_secrets.py
      - pyproject.toml
    triggers:
      - New BigQuery table added or schema changed
      - BQ table TTL or partition strategy changed
      - New GCP resource provisioned (Pub/Sub topic, scheduler, secret, bucket)
      - Phase task completed — check off the exit checklist item
      - Cloud Run or Dockerfile config changed
      - New secret added or renamed in Secret Manager
      - infra/main.tf changed
      - New verification command established
      - Smoke test added or removed

  GAOS-Manager-Spec.md:
    purpose: >
      High-level system design — orchestration topology, project registry schema,
      Pub/Sub routing, tool inventory overview, and system-wide data flow.
    code_paths:
      - agents/
      - tools/
      - main.py
      - config/settings.yaml
    triggers:
      - New orchestrator agent added
      - Pub/Sub routing topology changed
      - Project registry schema changed (new fields, renamed columns)
      - New top-level system capability added
      - Settings schema changed (new keys in settings.yaml)

  GAOS-Nexus-Prime-Spec.md:
    purpose: >
      Nexus-Prime deep-dive — OODA loop nodes, NexusPrimeWorkingMemory schema,
      approval gate logic, circuit breaker wiring, Phoenix recovery integration,
      and the think/iterate_plan/validate flow.
    code_paths:
      - agents/nexus_prime/
    triggers:
      - agents/nexus_prime/orchestrator.py modified
      - NexusPrimeWorkingMemory dataclass schema changed
      - New node added to the OODA loop
      - Approval gate logic changed (propose_gate, record)
      - Circuit breaker wiring in nexus-prime changed
      - Phoenix save_checkpoint / phoenix_recover integration changed
      - think() or iterate_plan() behavior changed
      - validate_output_coherence() integration changed

  GAOS-Email-Pipeline-Spec.md:
    purpose: >
      Reverse-engineered email pipeline specification — complete lifecycle from
      Gmail push notification to AI-composed reply and loop termination. Covers
      every function, variable, gate, and side effect in the two-cycle Pub/Sub flow.
      Updated 2026-04-16: duplicate-reply hardening (idempotency guard §13.1a,
      pre-send status lock §13.7, fail-closed exception handling, watermark always-advance §10.7).
    code_paths:
      - agents/nexus_prime/orchestrator.py
      - tools/gmail.py
      - tools/pubsub.py
      - main.py
      - config/settings.yaml
    triggers:
      - Email pipeline logic changed (process_gmail_notification, compose_reply, handle_gmail_webhook)
      - Gmail tool functions changed (fetch_new_messages, send_email, mark_as_read)
      - Loop prevention gates changed (Rule 26.1, 26.2, 26.3)
      - Outbound settings changed (max_emails_per_task, flood_threshold, etc.)
      - Gmail settings changed (trigger_keyword, monitored_address, sender_address)
      - New email-related MessageType or routing entry added
      - history_id watermark logic changed (§10.7)
      - compose_reply idempotency guard changed (§13.1a)
      - compose_reply pre-send lock logic changed (§13.7)
      - Exception handling in compose_reply gates changed (fail-open vs fail-closed)

  GAOS-Memory-Spec.md:
    purpose: >
      Memory system design — domain memory, monologue frames, token budget,
      load/store API, recency-first truncation, and BigQuery schema for memory tables.
    code_paths:
      - tools/memory.py
    triggers:
      - tools/memory.py modified
      - Memory BigQuery table schema changed (domain_memory, monologue_frames)
      - Token budget logic or truncation strategy changed
      - load_domain_memory() or save_domain_memory() signature changed
      - Recency-sort or progressive distillation logic changed

  GAOS-Chat-Dev-Reference.md:
    purpose: >
      Google Chat integration reference — JWT auth, CARD_CLICKED routing,
      slash commands, approval card schemas, and event payload formats.
    code_paths:
      - tools/google_chat.py
      - apps_script/
    triggers:
      - tools/google_chat.py modified
      - apps_script/*.gs modified
      - Chat card schema changed
      - CARD_CLICKED routing logic changed
      - JWT verification logic changed
      - New slash command added

  GAOS-Chat-Implementation-Problems.md:
    purpose: >
      Living document of known Google Chat integration failure modes,
      workarounds, and open bugs.
    code_paths:
      - tools/google_chat.py
      - apps_script/
    triggers:
      - New Chat integration bug discovered
      - Existing workaround confirmed effective or superseded
      - Chat quota or rate limit behaviour observed

  GAOS-Security-Policy.md:
    purpose: >
      Security policy — code safety gates, import allowlist, HMAC verification,
      JWT auth, secret handling, SHA-256 pinning, loop prevention (Rule 26),
      watermark advancement (Rule 29), and fail-closed guard requirements.
    code_paths:
      - agents/__init__.py
      - agents/nexus_prime/orchestrator.py
      - tools/secrets.py
      - tools/google_chat.py
      - tools/gmail.py
    triggers:
      - agents/__init__.py import allowlist modified
      - validate_code_safety() pattern list changed
      - New secret type or credential introduced
      - Auth, HMAC, or JWT logic changed
      - SHA-256 pinning logic changed
      - New OWASP-relevant finding discovered
      - Loop prevention gates changed (Rule 26.1 identity exclusion, 26.2 per-task cap, 26.3 flood guard)
      - Watermark/cursor advancement logic changed (Rule 29 — gmail_last_history_id or any offset pointer)
      - Idempotency guard exception handling changed (fail-open vs fail-closed)
      - Outbound flood or email cap settings changed

  GAOS-Skill-Compliance-Spec.md:
    purpose: >
      Externally sourced skill compliance — the mandatory 6-gate review process
      for importing any external Python module (tool, agent, or utility) into the
      AOS. Defines classification types (A–D) and mandatory gates per type.
      Companion to GAOS-Agent-Spec.md (internal build requirements).
    code_paths:
      - agents/
      - tools/
    triggers:
      - New external skill or agent class imported from outside the repository
      - Compliance gate list changed (Gates 1–6)
      - Skill classification table (Type A–D) updated
      - Self-evolution loop changes how agent code is imported

  GAOS-Privacy-Spec.md:
    purpose: >
      Privacy policy — data retention windows, PII handling rules,
      project_id scoping guarantees, and data minimisation practices.
    code_paths:
      - tools/
      - agents/
    triggers:
      - Data retention window changed (BQ TTL, logging duration)
      - New PII-adjacent field added to any schema
      - project_id scoping logic changed
      - New data store introduced (new BQ table, new GCS bucket)

  GAOS-Doctor.md:
    purpose: >
      Health check runbook — GAOS-Doctor script diagnostics,
      verification steps, and phase exit criteria.
    code_paths:
      - scripts/gaos_doctor.py
    triggers:
      - scripts/gaos_doctor.py modified
      - New diagnostic check added or removed
      - Phase exit criteria changed

  GAOS-Onboarding-Spec.md:
    purpose: >
      Onboarding guide — prerequisites, GCP setup steps, first-run walkthrough,
      and bootstrap sequence for new developers.
    code_paths:
      - scripts/setup_workspace.py
      - scripts/setup_secrets.py
      - scripts/bootstrap.py
      - pyproject.toml
    triggers:
      - Setup sequence changed
      - New prerequisite added (GCP service, Python version, secret)
      - Bootstrap script behaviour changed
      - Required IAM roles changed

  GAOS-Persona-Spec.md:
    purpose: >
      Strategic Architect persona rules — tone, response modes (Direct/Reframe/Research/Tactical),
      look-ahead behavior, and session defaults.
    code_paths:
      - Docs/brand-voice.md
      - Docs/AI-Autocoding-Rules.md
      - .github/copilot-instructions.md
    triggers:
      - Rule 15 (Persona) modified in AI-Autocoding-Rules.md
      - brand-voice.md updated
      - New response mode or archetype defined

  GAOS-Project-Glossary.md:
    purpose: >
      Project-wide glossary of terms, acronyms, agent names, and tool names.
    code_paths:
      - agents/
      - tools/
    triggers:
      - New agent, tool, or concept introduced
      - Term renamed across the codebase
      - New acronym established in a spec

  # NOTE: AI-Autocoding-Rules.md was deleted 2026-03-27.
  # The single authoritative rules file is .github/copilot-instructions.md.
  # VS Code injects it automatically as system context for every AI session.
  ".github/copilot-instructions.md":
    purpose: >
      Hard rules for all development — model aliases, safety gates, commit
      conventions, logging standards, PowerShell syntax, and automation-first policy.
      Authoritative and only copy; VS Code reads this file directly.
    code_paths:
      - pyproject.toml
      - .vscode/settings.json
      - agents/__init__.py
      - Docs/DOC-INDEX.yaml
    triggers:
      - New hard rule established from a lesson learned
      - Existing rule violated and a correction pattern established
      - New tooling standard adopted (formatter, linter, pre-commit hook)
      - DOC-INDEX.yaml schema changed (update §13 pointer)

  ".github/agents/gaos-architect.agent.md":
    purpose: >
      VS Code custom agent for GAOS development — scaffolding Tier 2/3 agents,
      compliance review against GAOS-Agent-Spec.md §8 checklist, and the
      /create-agent workflow with a 7-step construction + Completion Gate.
    code_paths:
      - .github/agents/
    triggers:
      - GAOS-Architect workflow, rules, or Result Goals changed
      - New agent construction pattern or tier classification rule established
      - GAOS-Agent-Spec.md §8 checklist updated

  ".github/instructions/agent-construction.instructions.md":
    purpose: >
      Always-on agent construction rules auto-injected when editing agents/**/*.py —
      cost tracking placement, Pydantic schema boundary enforcement, tier-specific
      node requirements, and identity file check.
    code_paths:
      - agents/
    triggers:
      - New construction rule derived from a lesson learned
      - Cost tracking or schema enforcement pattern changed
      - Tier-specific rule added or updated

  Morphic-GAOS-Manager-Summary.md:
    purpose: >
      Executive summary — what the system does, current phase status,
      key capabilities overview, and high-level metrics.
    code_paths:
      - README.md
    triggers:
      - Phase milestone completed
      - Major new capability added or removed
      - Test count changes significantly (>10%)

  GAOS-Marketing-Channel-Spec.md:
    purpose: >
      Marketing channel build-out spec — Phase 1 research mandates (MC1–MC3) with
      full Scout RESEARCH_MANDATE payloads, output schemas, and the HUMAN DECISION gate;
      Phase 2 setup (MC4–MC5 Beacon + n8n); Phase 3 content pipeline (MC6–MC8);
      platform API capability matrix; and Approval Gate proposal designs.
    code_paths:
      - agents/scout/orchestrator.py
      - agents/scout/tasks/discover_channels.py
      - scripts/send_scout_mandates.py
      - Docs/GAOS-Marketing-Channel-Spec.md
    triggers:
      - Scout RESEARCH_MANDATE handler logic changed
      - MC1/MC2/MC3 mandate payloads or output schemas revised
      - HUMAN DECISION gate design changed
      - Platform API capability matrix updated (after MC3 Scout output)
      - Phase 2 or Phase 3 mandate designs refined
      - n8n workflow sketches updated for MC5/MC7/MC8
      - New marketing channel mandate added (MC4+)

  GAOS-n8n-Integration-Spec.md:
    purpose: >
      Architecture decision and deployment guide for n8n as GAOS's SaaS connector
      layer. Covers the three workflow classes (standalone, Pub/Sub bridge, GAOS native),
      system architecture diagram, Cloud Run deployment plan, IAM setup, pilot selection
      criteria, and governance conventions.
    code_paths:
      - Docs/Automation-Wish-List.md
    triggers:
      - Workflow classification (Class 1/2/3) definition changed
      - n8n deployment config changed (Cloud Run, Cloud SQL, IAM)
      - New Class 2 flow wired to a GAOS Pub/Sub topic
      - Pilot workflow selected or completed
      - n8n SA permissions changed
      - A2AMessage envelope format for n8n flows changed

  GAOS-Voice-Input-Spec.md:
    purpose: >
      Architecture and build plan for voice input to Nexus-Prime — covers the
      zero-code Gmail path, Google Chat diagnosis gate, the /speak HMAC endpoint
      design, iOS Shortcut and Android Tasker client setup, VOICE_HMAC_SECRET
      provisioning, and the implementation checklist.
    code_paths:
      - main.py
      - tools/google_chat.py
    triggers:
      - /speak endpoint added to main.py
      - VOICE_HMAC_SECRET provisioned or rotated
      - Google Chat mobile delivery issue resolved or confirmed permanent
      - iOS Shortcut or Android Tasker client setup changes
      - Response delivery strategy changed (sync vs. queued)

  GAOS-CEO-Dashboard.md:
    purpose: >
      Reference for the Grafana CEO Overview dashboard — all 16 panels,
      their BigQuery sources, threshold color codes, and update cadence.
    code_paths:
      - dashboard/grafana/dashboards/ceo-overview.json
      - dashboard/grafana/provisioning/
    triggers:
      - New panel added or removed from ceo-overview.json
      - BQ table or query backing a panel changed
      - Grafana refresh interval changed
      - Staging sync cadence changed
      - Threshold color breakpoints changed

  working-preferences.md:
    purpose: >
      Developer working preferences — editor setup, debug flows,
      terminal conventions, and personal session rules.
    code_paths: []
    triggers:
      - Working preferences or tooling setup changed at user request

  brand-voice.md:
    purpose: >
      Brand voice and communication style guide for all GAOS-generated output.
    code_paths: []
    triggers:
      - Communication style rules changed
      - New tone or formatting convention established

# ---------------------------------------------------------------------------
# AGENT IDENTITY FILES  (Docs/agents/<name>.md)
# ---------------------------------------------------------------------------
# Each file covers one agent's identity, persona, constraints, and behavioral
# guidelines. Update the relevant file whenever that agent changes.

agent_identity_files:

  beacon.md:
    agent_dir: agents/beacon/
    triggers:
      - agents/beacon/orchestrator.py behaviour changed
      - Beacon persona or identity updated

  foreman.md:
    agent_dir: agents/foreman/
    triggers:
      - agents/foreman/orchestrator.py behaviour changed
      - Foreman persona or identity updated

  ledger.md:
    agent_dir: agents/ledger/
    triggers:
      - agents/ledger/orchestrator.py behaviour changed
      - Ledger persona or identity updated

  nexus-prime.md:
    agent_dir: agents/nexus_prime/
    triggers:
      - agents/nexus_prime/orchestrator.py behaviour changed
      - Nexus-Prime persona or identity updated
      - OODA loop nodes changed

  pursuit.md:
    agent_dir: agents/pursuit/
    triggers:
      - agents/pursuit/orchestrator.py behaviour changed
      - Pursuit persona or identity updated

  scout.md:
    agent_dir: agents/scout/
    triggers:
      - agents/scout/orchestrator.py behaviour changed
      - Scout persona or identity updated

  steward.md:
    agent_dir: agents/steward/
    triggers:
      - agents/steward/orchestrator.py behaviour changed
      - Steward persona or identity updated

  Archivist.md:
    agent_dir: agents/steward/archivist/
    triggers:
      - agents/steward/archivist/orchestrator.py behaviour changed
      - Archivist persona or identity updated
      - Archivist classification logic or batch limits changed

# ---------------------------------------------------------------------------
# INVERSE INDEX — code path → documents to update
# ---------------------------------------------------------------------------
# Use this section for fast lookup: "I changed X, what docs do I update?"

inverse_index:

  "agents/":
    - GAOS-Agent-Spec.md
    - GAOS-Manager-Spec.md
    - GAOS-Project-Glossary.md          # if new agent added
    - "Docs/agents/<name>.md"           # identity file for the changed agent

  "agents/__init__.py":
    - GAOS-Agent-Spec.md
    - GAOS-Security-Policy.md           # import allowlist, safety gates

  "agents/nexus_prime/":
    - GAOS-Nexus-Prime-Spec.md
    - GAOS-Agent-Spec.md
    - GAOS-Email-Pipeline-Spec.md       # email pipeline nodes
    - "Docs/agents/nexus-prime.md"

  "agents/scout/":
    - GAOS-Agent-Spec.md
    - "Docs/agents/scout.md"
    - GAOS-Marketing-Channel-Spec.md    # RESEARCH_MANDATE handler + discover_channels task

  "agents/steward/archivist/":
    - GAOS-Agent-Spec.md                # Tier 3 sub-agent
    - GAOS-Manager-Spec.md              # §17 implementation checklist
    - "Docs/agents/Archivist.md"        # identity file
    - "Docs/agents/steward.md"          # parent orchestrator awareness

  "tools/":
    - GAOS-Tools-Spec.md
    - GAOS-Manager-Spec.md              # if it affects system-level data flow
    - GAOS-Privacy-Spec.md              # if a new data store is introduced

  "tools/memory.py":
    - GAOS-Memory-Spec.md
    - GAOS-Tools-Spec.md

  "tools/circuit_breaker.py":
    - GAOS-Tools-Spec.md                # §19
    - GAOS-Nexus-Prime-Spec.md          # wiring section

  "tools/phoenix.py":
    - GAOS-Tools-Spec.md                # §20
    - GAOS-Nexus-Prime-Spec.md          # wiring section
    - GAOS-Deploy-Spec.md               # agent_checkpoints BQ table

  "tools/google_chat.py":
    - GAOS-Chat-Dev-Reference.md
    - GAOS-Chat-Implementation-Problems.md
    - GAOS-Security-Policy.md           # JWT / HMAC

  "tools/secrets.py":
    - GAOS-Security-Policy.md
    - GAOS-Tools-Spec.md

  "tools/gmail.py":
    - GAOS-Email-Pipeline-Spec.md
    - GAOS-Tools-Spec.md

  "main.py":
    - GAOS-Chat-Dev-Reference.md
    - GAOS-Email-Pipeline-Spec.md
    - GAOS-Voice-Input-Spec.md        # /speak endpoint
    - GAOS-Agent-Spec.md
    - GAOS-Manager-Spec.md
    - GAOS-Deploy-Spec.md

  "tools/webhook_sender.py":
    - GAOS-Tools-Spec.md
    - GAOS-Voice-Input-Spec.md        # same HMAC pattern



  "apps_script/":
    - GAOS-Chat-Dev-Reference.md
    - GAOS-Skill-Compliance-Spec.md
    - GAOS-Deploy-Spec.md   # §4.4–4.6 cover Apps Script setup and protection; setup_protection.gs changes require §4.5 update

  "infra/":
    - GAOS-Deploy-Spec.md

  "Dockerfile":
    - GAOS-Deploy-Spec.md

  "scripts/bootstrap.py":
    - GAOS-Deploy-Spec.md
    - GAOS-Onboarding-Spec.md

  "scripts/setup_*.py":
    - GAOS-Onboarding-Spec.md
    - GAOS-Deploy-Spec.md

  "scripts/send_scout_mandates.py":
    - GAOS-Marketing-Channel-Spec.md   # mandate payload definitions live here

  "scripts/gaos_doctor.py":
    - GAOS-Doctor.md

  "config/settings.yaml":
    - GAOS-Manager-Spec.md
    - GAOS-Deploy-Spec.md               # if a new secret or alias is added

  "pyproject.toml":
    - GAOS-Deploy-Spec.md
    - GAOS-Onboarding-Spec.md
    - ".github/copilot-instructions.md" # if tooling standards change

  "README.md":
    - Morphic-GAOS-Manager-Summary.md

  "Docs/brand-voice.md":
    - GAOS-Persona-Spec.md

  ".github/copilot-instructions.md":
    - GAOS-Persona-Spec.md              # if Rule 15 changes

  ".github/agents/":
    - ".github/agents/gaos-architect.agent.md"
    - GAOS-Agent-Spec.md               # if the §8 checklist embedded in the agent changes

  ".github/instructions/":
    - ".github/instructions/agent-construction.instructions.md"
    - GAOS-Agent-Spec.md               # if construction rules reference spec sections

  "dashboard/grafana/dashboards/ceo-overview.json":
    - GAOS-CEO-Dashboard.md

  "dashboard/grafana/provisioning/":
    - GAOS-CEO-Dashboard.md

  "Docs/DOC-INDEX.yaml":
    - ".github/copilot-instructions.md" # §13 pointer
